# Cloudflare Pages Configuration for Nyxora Sync
# https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
# 
# NOTE: Build configuration (command, output directory) must be set in
# Cloudflare Dashboard → Pages → Settings → Build
# NOT in this file - Pages projects don't support [build] section in wrangler.toml

name = "nyxora-sync"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]

# Preview environment (auto-created per branch)
[env.preview]
name = "nyxora-sync-preview"

# Production environment
[env.production]
name = "nyxora-sync"

# Node.js version for builds
# Set in Cloudflare Dashboard: Pages → Settings → Build → Node.js version = 20

# Build settings (configure in Dashboard, not here):
# Build command: npm run build:cf
# Build output directory: .vercel/output/static
# Root directory: (leave empty)