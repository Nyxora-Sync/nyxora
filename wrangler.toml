# Cloudflare Pages Configuration for Nyxora Sync
# https://developers.cloudflare.com/pages/configuration/wrangler-configuration/

name = "nyxora-sync"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]

# Build output directory (created by @cloudflare/next-on-pages)
pages_build_output_dir = ".vercel/output/static"

[build]
# Build command runs next build then next-on-pages
command = "npm run build && npx @cloudflare/next-on-pages"

# Environment variables - set these in Cloudflare Dashboard instead
# [vars]
# NEXT_PUBLIC_SITE_URL = "https://nyxora-sync.pages.dev"
# NEXTAUTH_URL = "https://nyxora-sync.pages.dev"

# Preview environment (auto-created per branch)
[env.preview]
name = "nyxora-sync-preview"

# Production environment
[env.production]
name = "nyxora-sync"

# Node.js version for builds
# Set in Cloudflare Dashboard: Pages → Settings → Build → Node.js version = 20